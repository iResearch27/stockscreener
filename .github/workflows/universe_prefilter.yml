name: Universe Pre-filter

on:
  # Runs by itself when the Universe Screen workflow finishes successfully; can also be started by hand.
  workflow_run:
    workflows: ["Universe Screen"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run universe pre-filter
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python universe_prefilter.py

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/ candidates.txt || true
          git diff --cached --quiet || git commit -m "Update universe candidates [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin ${{ github.ref_name }} && git push && break
            sleep $((i * 5))
          done
