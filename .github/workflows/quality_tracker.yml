name: Quality Tracker

on:
  schedule:
    # Saturday 5:00 PM IST (11:30 UTC). Fundamentals only change when companies report, so weekly is enough.
    - cron: "30 11 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quality tracker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python quality_tracker.py

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/ || true
          git diff --cached --quiet || git commit -m "Update tracker results [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
