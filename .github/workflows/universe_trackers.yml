name: Universe Trackers

on:
  # Runs by itself when the Universe Pre-filter finishes successfully (it writes candidates.txt); can also be started by hand.
  workflow_run:
    workflows: ["Universe Pre-filter"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      STOCKS_FILE: candidates.txt
      UNIVERSE_MODE: "1"
      SKIP_EMAIL: "1"
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # One after another, not in parallel, to keep the load on Yahoo low. A failure in one does not stop the others.
      - name: Quality tracker on candidates
        continue-on-error: true
        run: python quality_tracker.py

      - name: Earnings tracker on candidates
        continue-on-error: true
        run: python earnings_tracker.py

      - name: Valuation tracker on candidates
        continue-on-error: true
        run: python valuation_tracker.py

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/ || true
          git diff --cached --quiet || git commit -m "Update universe tracker results [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin ${{ github.ref_name }} && git push && break
            sleep $((i * 5))
          done
