name: Earnings Tracker

on:
  schedule:
    # 4:30 PM IST (11:00 UTC), Monday to Friday, after the other trackers
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run earnings tracker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python earnings_tracker.py

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add results/ || true
          git diff --cached --quiet || git commit -m "Update tracker results [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin ${{ github.ref_name }} && git push && break
            sleep $((i * 5))
          done
